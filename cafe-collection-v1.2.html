<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>咖啡收藏簿 · 台北</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* 字體：jf open 粉圓 2.1（SIL OFL），檔案放在 fonts/ */
      @font-face {
        font-family: "jf-openhuninn";
        src: url("fonts/jf-openhuninn-2.1.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --paper: #e8d9c3;
        --paper-dot: #d9c6a8;
        --card: #fffaf1;
        --ink: #2e1f16;
        --ink-soft: #6b5444;
        --bean: #5a3a27;
        --crema: #c98f4a;
        --crema-ink: #2e1f16;
        --badge: #ead6bb;
        --bar-bg: #efe3d1;
        --nav: #fffaf1;
        --line: #2e1f16;
        --heart: #c0392b;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #1f1611;
          --paper-dot: #2b2019;
          --card: #2d2119;
          --ink: #f3e6d4;
          --ink-soft: #bda68f;
          --bean: #d9a86c;
          --crema: #c98f4a;
          --crema-ink: #1f1611;
          --badge: #4a3526;
          --bar-bg: #3b2c21;
          --nav: #2a1f18;
          --line: #0f0a07;
          --heart: #ff6b5b;
        }
      }
      :root[data-theme="dark"] {
        --paper: #1f1611;
        --paper-dot: #2b2019;
        --card: #2d2119;
        --ink: #f3e6d4;
        --ink-soft: #bda68f;
        --bean: #d9a86c;
        --crema: #c98f4a;
        --crema-ink: #1f1611;
        --badge: #4a3526;
        --bar-bg: #3b2c21;
        --nav: #2a1f18;
        --line: #0f0a07;
        --heart: #ff6b5b;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          "jf-openhuninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(
          var(--paper-dot) 1px,
          transparent 1.2px
        );
        background-size: 14px 14px;
        -webkit-tap-highlight-color: transparent;
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        padding: 0 14px 110px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--crema);
        outline-offset: 2px;
      }

      /* Header */
      .top {
        padding: 18px 2px 10px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        font-family: "jf-openhuninn", sans-serif;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.1;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .brand small {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: var(--ink-soft);
        margin-top: 4px;
        font-family: "jf-openhuninn", sans-serif;
        letter-spacing: 0;
      }
      .stamp {
        flex: none;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 2px dashed var(--bean);
        color: var(--bean);
        display: grid;
        place-items: center;
        text-align: center;
        font-family: "jf-openhuninn", sans-serif;
        font-size: 12px;
        line-height: 1.15;
        transform: rotate(-10deg);
      }
      .stamp b {
        font-size: 18px;
        display: block;
      }

      /* Search */
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 2.5px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
        height: 46px;
        box-shadow: 3px 3px 0 var(--line);
        margin: 6px 0 12px;
      }
      .search .bi {
        flex: none;
        color: var(--ink-soft);
        font-size: 19px;
        line-height: 1;
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
      }
      .search input::placeholder {
        color: var(--ink-soft);
      }
      .search .clear {
        border: 0;
        background: none;
        padding: 4px;
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 18px;
        line-height: 1;
      }

      .rail {
        position: relative;
        margin: 0 -14px;
      }
      .rail::before,
      .rail::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 10px;
        width: 44px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 1;
      }
      .rail::before {
        left: 0;
        background: linear-gradient(to right, var(--paper) 30%, transparent);
      }
      .rail::after {
        right: 0;
        background: linear-gradient(to left, var(--paper) 30%, transparent);
      }
      .rail.can-l::before,
      .rail.can-r::after {
        opacity: 1;
      }
      .rail-btn {
        position: absolute;
        top: calc(50% - 5px);
        transform: translateY(-50%);
        z-index: 2;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--ink);
        display: none;
        place-items: center;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        box-shadow: 2px 2px 0 var(--line);
      }
      .rail-btn.l {
        left: 6px;
      }
      .rail-btn.r {
        right: 6px;
      }
      .rail.can-l .rail-btn.l,
      .rail.can-r .rail-btn.r {
        display: grid;
      }
      .chips {
        position: relative;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 16px 10px;
        scrollbar-width: none;
        cursor: grab;
        touch-action: pan-x pan-y;
        overscroll-behavior-x: contain;
      }
      .chips.dragging {
        cursor: grabbing;
        scroll-behavior: auto;
      }
      .chips.dragging .chip {
        pointer-events: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        border: 2px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        padding: 6px 13px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .chip[aria-pressed="true"] {
        background: var(--bean);
        color: var(--card);
        border-color: var(--line);
      }

      .result-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--ink-soft);
        margin: 4px 2px 14px;
      }
      .result-line strong {
        color: var(--ink);
      }

      /* Grid & Card */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 12px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 2.5px solid var(--line);
        border-radius: 10px;
        box-shadow: 4px 4px 0 var(--line);
        display: flex;
        flex-direction: column;
      }
      .card:nth-child(4n + 1) {
        transform: rotate(-0.7deg);
      }
      .card:nth-child(4n + 2) {
        transform: rotate(0.6deg);
      }
      .card:nth-child(4n + 3) {
        transform: rotate(0.4deg);
      }
      .card:nth-child(4n) {
        transform: rotate(-0.5deg);
      }
      .pin {
        position: absolute;
        top: -9px;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        background: var(--ink);
        border-radius: 50%;
        z-index: 2;
        box-shadow: inset -3px -3px 0 rgba(255, 255, 255, 0.18);
      }
      .cover {
        position: relative;
        aspect-ratio: 4/3.4;
        border-bottom: 2.5px solid var(--line);
        overflow: hidden;
        border-radius: 7px 7px 0 0;
      }
      .cover svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .badge {
        position: absolute;
        left: 6px;
        bottom: 6px;
        background: var(--badge);
        color: var(--ink);
        border: 2px solid var(--line);
        font-size: 11.5px;
        font-weight: 700;
        padding: 1px 7px;
        border-radius: 7px;
      }
      .fav {
        position: absolute;
        right: 6px;
        top: 6px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .fav .bi {
        font-size: 17px;
        line-height: 1;
      }
      .fav .bi-heart-fill {
        display: none;
        color: var(--heart);
      }
      .fav[aria-pressed="true"] .bi-heart {
        display: none;
      }
      .fav[aria-pressed="true"] .bi-heart-fill {
        display: block;
      }
      .fav.pop {
        animation: pop 0.32s ease;
      }
      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: var(--bar-bg);
      }
      .photo-btn {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
        padding: 0;
      }
      .photo-btn .bi {
        font-size: 15px;
        line-height: 1;
      }
      .sheet-mask {
        position: fixed;
        inset: 0;
        background: rgba(20, 12, 8, 0.45);
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border: 2.5px solid var(--line);
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
        animation: up 0.22s ease;
      }
      @keyframes up {
        from {
          transform: translateY(100%);
        }
      }
      .sheet h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .sheet p {
        margin: 0 0 14px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .sheet button {
        display: block;
        width: 100%;
        height: 46px;
        margin-top: 8px;
        border: 2px solid var(--line);
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        background: var(--card);
      }
      .sheet .primary {
        background: var(--crema);
        color: var(--crema-ink);
      }
      .sheet .danger {
        color: var(--heart);
      }
      .url-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .url-row input {
        flex: 1;
        min-width: 0;
        height: 46px;
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 0 12px;
        font: inherit;
        font-size: 14px;
        background: var(--card);
        color: var(--ink);
      }
      .sheet .url-ok {
        width: auto;
        margin: 0;
        padding: 0 16px;
        background: var(--bean);
        color: var(--card);
      }
      .url-hint {
        font-size: 12px !important;
        margin: 6px 2px 0 !important;
        min-height: 0;
      }
      .url-hint:empty {
        display: none;
      }
      .loading-photo {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }
      @keyframes pop {
        40% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }

      .body {
        padding: 9px 9px 10px;
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .name {
        font-size: 15.5px;
        font-weight: 700;
        margin: 0;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .addr .bi {
        flex: none;
        color: var(--heart);
      }
      .addr {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 3px 0 0;
        display: flex;
        gap: 3px;
        align-items: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 7px 0 0;
        min-height: 20px;
      }
      .tag {
        font-size: 11px;
        border: 1.5px solid var(--ink-soft);
        color: var(--ink-soft);
        border-radius: 5px;
        padding: 0 5px;
        line-height: 17px;
      }
      .btn {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: var(--crema);
        color: var(--crema-ink);
        text-decoration: none;
        border: 2px solid var(--line);
        border-radius: 8px;
        height: 34px;
        font-size: 13.5px;
        font-weight: 700;
        margin-block-start: 9px;
      }
      .btn:active {
        transform: translate(1px, 1px);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        font-weight: 700;
        margin-top: 8px;
        gap: 4px;
      }
      .meta span:last-child {
        font-weight: 500;
        color: var(--ink-soft);
      }
      .bar {
        height: 7px;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: var(--bar-bg);
        margin-top: 4px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--crema);
      }

      /* Pager */
      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin: 28px 0 6px;
        flex-wrap: wrap;
      }
      .pager button {
        min-width: 38px;
        height: 38px;
        border: 2px solid var(--line);
        border-radius: 9px;
        background: var(--card);
        font-weight: 700;
        cursor: pointer;
        padding: 0 8px;
      }
      .pager button[aria-current="page"] {
        background: var(--bean);
        color: var(--card);
      }
      .pager button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pager-note {
        text-align: center;
        font-size: 12px;
        color: var(--ink-soft);
      }

      /* Empty */
      .empty {
        text-align: center;
        padding: 40px 20px;
        background: var(--card);
        border: 2.5px dashed var(--ink-soft);
        border-radius: 14px;
        margin-top: 8px;
      }
      .empty .big {
        font-size: 42px;
        line-height: 1;
        color: var(--crema);
      }
      .empty h2 {
        font-family: "jf-openhuninn", sans-serif;
        margin: 12px 0 6px;
        font-size: 21px;
      }
      .empty p {
        margin: 0 0 16px;
        color: var(--ink-soft);
        font-size: 14px;
        line-height: 1.6;
      }
      .empty .go {
        border: 2px solid var(--line);
        background: var(--crema);
        color: var(--crema-ink);
        border-radius: 9px;
        padding: 9px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      /* Bottom Nav */
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--nav);
        border-top: 2.5px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .nav-in {
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        justify-content: space-around;
        padding: 8px 24px 8px;
      }
      .tab {
        border: 0;
        background: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
        min-width: 96px;
        padding: 0;
      }
      .tab .ic {
        width: 62px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        transition: background 0.2s;
      }
      .tab .ic .bi {
        font-size: 21px;
        line-height: 1;
      }
      .tab .bi-bookmark-fill,
      .tab[aria-current="page"] .bi-bookmark {
        display: none;
      }
      .tab[aria-current="page"] .bi-bookmark-fill {
        display: inline;
      }
      .tab[aria-current="page"] {
        color: var(--bean);
        font-weight: 700;
      }
      .tab[aria-current="page"] .ic {
        background: var(--bean);
        color: var(--card);
      }
      .count {
        position: absolute;
        margin: -4px 0 0 26px;
        background: var(--heart);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        padding: 0 4px;
        border: 2px solid var(--nav);
      }
      .tab .ic {
        position: relative;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 20px);
        background: var(--ink);
        color: var(--card);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 13.5px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 30;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .hidden {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 class="brand" id="pageTitle">
          丐幫找咖啡<small id="pageSub">台北市 · 8 個捷運生活圈 · 118 間</small>
        </h1>
        <div class="stamp" aria-hidden="true">
          <div><b>台北</b>CAFÉ</div>
        </div>
      </header>

      <!-- 查詢 -->
      <section id="viewSearch">
        <label class="search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input
            id="q"
            type="search"
            placeholder="搜尋店名、街道或特色（如：插座）"
            autocomplete="off"
            aria-label="搜尋咖啡廳"
          />
          <button
            class="clear hidden"
            id="clearQ"
            type="button"
            aria-label="清除搜尋"
          >
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </label>
        <div class="rail">
          <button
            class="rail-btn l"
            type="button"
            data-dir="-1"
            aria-label="往左捲動區域"
            tabindex="-1"
          >
            <i class="bi bi-chevron-left"></i>
          </button>
          <div
            class="chips"
            id="areaChips"
            role="group"
            aria-label="選擇區域"
          ></div>
          <button
            class="rail-btn r"
            type="button"
            data-dir="1"
            aria-label="往右捲動區域"
            tabindex="-1"
          >
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="result-line">
          <span id="resultCount"></span><span id="pageInfo"></span>
        </div>
        <div class="grid" id="searchGrid"></div>
        <div id="searchEmpty"></div>
        <nav class="pager" id="searchPager" aria-label="分頁"></nav>
      </section>

      <!-- 我的收藏 -->
      <section id="viewFav" class="hidden">
        <div class="rail">
          <button
            class="rail-btn l"
            type="button"
            data-dir="-1"
            aria-label="往左捲動區域"
            tabindex="-1"
          >
            <i class="bi bi-chevron-left"></i>
          </button>
          <div
            class="chips"
            id="favChips"
            role="group"
            aria-label="收藏區域篩選"
          ></div>
          <button
            class="rail-btn r"
            type="button"
            data-dir="1"
            aria-label="往右捲動區域"
            tabindex="-1"
          >
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="result-line">
          <span id="favCount"></span><span id="favPageInfo"></span>
        </div>
        <div class="grid" id="favGrid"></div>
        <div id="favEmpty"></div>
        <nav class="pager" id="favPager" aria-label="收藏分頁"></nav>
      </section>
    </div>

    <nav class="nav" aria-label="主選單">
      <div class="nav-in">

      const PER_PAGE = 15;

      /* ===== 狀態 ===== */

      /* 預設封面：店名為示意，先用咖啡廳主題照片（Unsplash）；換成真實店家後，在 RAW 第 6 欄填入店家照片網址即可 */
      const STOCK = [

      function autoImg(c) {

      let failNotified = false;
      document.addEventListener(

      /* ===== 封面插畫 ===== */
      const PALETTES = [

      function cover(c) {
        const p = PALETTES[c.seed % PALETTES.length];

        let art = "";

        } else if (v === 1) {
          // 俯視拉花
          art = `<circle cx="100" cy="102" r="50" fill="${p[2]}" stroke="#2e1f16" stroke-width="3"/>

      <rect x="72" y="112" width="56" height="40" rx="8" fill="${p[1]}" stroke="#2e1f16" stroke-width="3" opacity=".95"/>
      <path d="M100 110v8" stroke="${p[1]}" stroke-width="4" stroke-linecap="round"/>
      <path d="M78 128h44" stroke="${p[2]}" stroke-width="2.5" opacity=".6"/>`;
        } else {

      <path d="M50 78h100l-8-18H58z" fill="${p[1]}" stroke="#2e1f16" stroke-width="3" stroke-linejoin="round"/>
      <path d="M62 60v18M78 60v18M94 60v18M110 60v18M126 60v18M142 60v18" stroke="${p[2]}" stroke-width="4" opacity=".7"/>
      <rect x="88" y="104" width="24" height="48" fill="${p[1]}" stroke="#2e1f16" stroke-width="3"/>

      /* ===== 卡片 ===== */
      const heartIcon = `<i class="bi bi-heart" aria-hidden="true"></i><i class="bi bi-heart-fill" aria-hidden="true"></i>`;
      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m],
        );
      }
      function card(c) {
        const on = state.favs.has(c.id);
        const map =
          c.map ||
          "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent("台北市 " + c.addr + " " + c.name);
        return `<article class="card">
    <span class="pin" aria-hidden="true"></span>
    <div class="cover" data-cover="${c.id}">${imgOf(c) ? `<img src="${esc(imgOf(c))}" alt="${esc(c.name)} 店家照片" loading="lazy" referrerpolicy="no-referrer" data-fallback="${c.id}">` : cover(c)}
      <button class="photo-btn" data-photo="${c.id}" aria-label="設定 ${esc(c.name)} 的圖片">

    </div>
    <div class="body">
      <h3 class="name">${esc(c.name)}</h3>
      <p class="addr"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i>${esc(c.addr)}</p>
      <div class="tags">${c.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <a class="btn" href="${esc(map)}" target="_blank" rel="noopener">
        <i class="bi bi-map" aria-hidden="true"></i>查看地圖</a>
      <div class="meta"><span><i class="bi bi-star-fill" aria-hidden="true"></i> ${c.rating ? c.rating.toFixed(1) : "—"}</span><span>${esc(c.hours || "營業時間未知")}</span></div>
      <div class="bar" role="img" aria-label="${c.rating ? `評分 ${c.rating} / 5` : "尚無評分"}"><i style="width:${((c.rating || 0) / 5) * 100}%"></i></div>

      /* ===== 分頁 ===== */
      function pager(el, total, page, onGo) {
        const pages = Math.max(1, Math.ceil(total / PER_PAGE));
        if (total <= PER_PAGE) {
          el.innerHTML = "";
          return;
        }
        let h = `<button data-p="${page - 1}" ${page <= 1 ? "disabled" : ""} aria-label="上一頁">‹</button>`;
        for (let i = 1; i <= pages; i++) {
          if (pages > 7 && i !== 1 && i !== pages && Math.abs(i - page) > 1) {
            if (i === 2 || i === pages - 1)
              h += `<span aria-hidden="true">…</span>`;
            continue;
          }
          h += `<button data-p="${i}" ${i === page ? 'aria-current="page"' : ""}>${i}</button>`;
        }
        h += `<button data-p="${page + 1}" ${page >= pages ? "disabled" : ""} aria-label="下一頁">›</button>`;
        el.innerHTML = h;
        el.onclick = (e) => {
          const b = e.target.closest("button[data-p]");
          if (!b || b.disabled) return;
          onGo(+b.dataset.p);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      }

      /* ===== Chips ===== */
      function chips(el, current, counts, onPick) {
        el.innerHTML = ["全部", ...AREAS]
          .map((a) => {
            const n = counts ? ` ${counts[a] ?? 0}` : "";
            return `<button class="chip" data-a="${a}" aria-pressed="${a === current}">${a}${counts ? `<span style="opacity:.7">${n}</span>` : ""}</button>`;
          })
          .join("");
        el.onclick = (e) => {
          const b = e.target.closest(".chip");
          if (b) onPick(b.dataset.a);
        };
        if (!el._rail) initRail(el);
        const act = el.querySelector('[aria-pressed="true"]');
        if (
          act &&
          (act.offsetLeft < el.scrollLeft ||
            act.offsetLeft + act.offsetWidth > el.scrollLeft + el.clientWidth)
        )
          el.scrollTo({
            left: act.offsetLeft - (el.clientWidth - act.offsetWidth) / 2,
            behavior: "smooth",
          });
        requestAnimationFrame(el._rail);
      }

      /* 區域列：可左右滑動（觸控滑、滑鼠拖曳、滾輪、左右箭頭） */
      function initRail(el) {
        const rail = el.parentElement;
        const upd = () => {
          const max = el.scrollWidth - el.clientWidth;
          rail.classList.toggle("can-l", el.scrollLeft > 2);
          rail.classList.toggle("can-r", el.scrollLeft < max - 2);
        };
        el._rail = upd;
        el.addEventListener("scroll", upd, { passive: true });
        window.addEventListener("resize", upd);
        el.addEventListener(
          "wheel",
          (e) => {
            if (
              el.scrollWidth <= el.clientWidth ||
              Math.abs(e.deltaX) > Math.abs(e.deltaY)
            )
              return;
            e.preventDefault();
            el.scrollLeft += e.deltaY;
          },
          { passive: false },
        );
        let down = null,
          moved = false;
        el.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "mouse" || e.button !== 0) return;
          down = { x: e.clientX, left: el.scrollLeft };
          moved = false;
        });
        el.addEventListener("pointermove", (e) => {
          if (!down) return;
          const dx = e.clientX - down.x;
          if (!moved && Math.abs(dx) > 5) {
            moved = true;
            el.classList.add("dragging");
            el.setPointerCapture(e.pointerId);
          }
          if (moved) el.scrollLeft = down.left - dx;
        });
        const end = () => {
          down = null;
          el.classList.remove("dragging");
        };
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        el.addEventListener(
          "click",
          (e) => {
            if (moved) {
              e.stopImmediatePropagation();
              e.preventDefault();
              moved = false;
            }
          },
          true,
        );
        rail.querySelectorAll(".rail-btn").forEach((b) =>
          b.addEventListener("click", () => {
            el.scrollBy({
              left: +b.dataset.dir * el.clientWidth * 0.6,
              behavior: "smooth",
            });
          }),
        );
      }

      /* ===== 渲染：查詢 ===== */
      function filterSearch() {
        const q = state.q.trim().toLowerCase();
        return CAFES.filter((c) => {
          if (state.area !== "全部" && c.area !== state.area) return false;
          if (!q) return true;
          return (c.name + c.addr + c.area + c.tags.join(""))
            .toLowerCase()
            .includes(q);
        });
      }
      function renderSearch() {
        chips(document.getElementById("areaChips"), state.area, null, (a) => {

        const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));

      /* ===== 渲染：收藏 ===== */
      function renderFav() {
        const all = CAFES.filter((c) => state.favs.has(c.id));

          : `<div class="empty"><i class="bi bi-bookmark-heart big" aria-hidden="true"></i><h2>收藏簿還是空的</h2><p>在查詢頁點卡片右上角的愛心，<br>喜歡的咖啡廳就會收進這裡。</p><button class="go" data-tab-go="search">去丐幫找咖啡廳</button></div>`;

      /* ===== Toast ===== */
      let tt;

      /* ===== 事件 ===== */
      /* ===== 店家圖片 ===== */
      const photoInput = document.getElementById("photoInput"),
        sheet = document.getElementById("sheet");
      let photoTarget = null;
      function compress(file) {
        return new Promise((res, rej) => {
          const url = URL.createObjectURL(file),
            img = new Image();
          img.onload = () => {
            const max = 520,
              r = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.round(img.width * r);
            cv.height = Math.round(img.height * r);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            URL.revokeObjectURL(url);
            res(cv.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            rej();
          };
          img.src = url;
        });
      }
      function rerender() {
        state.tab === "fav" ? renderFav() : renderSearch();

      const urlInput = document.getElementById("urlInput"),
        urlHint = document.getElementById("urlHint");
      function openSheet(id) {
        photoTarget = id;
        const c = CAFES.find((x) => x.id === id);
        document.getElementById("sheetSub").textContent = c.name;
        const cur = photos[id] || "";
        urlInput.value = cur.startsWith("http") ? cur : "";
        urlHint.textContent = "";
        document
          .getElementById("removeBtn")
          .classList.toggle("hidden", !photos[id]);
        sheet.classList.remove("hidden");
        sheet.querySelector(".primary").focus();
      }
      function applyUrl() {
        const v = urlInput.value.trim();
        let u;
        try {
          u = new URL(v);
        } catch (e) {
          urlHint.textContent = "請貼上完整網址，開頭是 https://";
          return;
        }
        if (!/^https?:$/.test(u.protocol)) {
          urlHint.textContent = "只支援 http 或 https 開頭的網址";
          return;
        }
        urlHint.textContent = "檢查圖片中…";
        const test = new Image();
        test.onload = () => {
          photos[photoTarget] = u.href;
          savePhotos();
          closeSheet();
          rerender();
          toast("已套用圖片網址");
        };
        test.onerror = () => {
          urlHint.textContent =
            "這個網址的圖片載入不了。可能不是圖片直連（要 .jpg/.png 那種），或目前環境擋了外部圖片，改用上傳就一定可以。";
        };
        test.referrerPolicy = "no-referrer";
        test.src = u.href;
      }
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          applyUrl();
        }
      });
      function closeSheet() {
        sheet.classList.add("hidden");
      }
      sheet.addEventListener("click", (e) => {
        if (e.target === sheet) {
          closeSheet();
          return;
        }
        const b = e.target.closest("[data-sheet]");
        if (!b) return;
        const act = b.dataset.sheet;
        if (act === "url") {
          applyUrl();
          return;
        }
        closeSheet();
        if (act === "replace") photoInput.click();
        if (act === "remove") {
          delete photos[photoTarget];
          savePhotos();
          rerender();
          toast("已移除圖片");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !sheet.classList.contains("hidden"))
          closeSheet();
      });
      photoInput.addEventListener("change", async () => {
        const file = photoInput.files[0];
        photoInput.value = "";
        if (!file || !photoTarget) return;
        if (!file.type.startsWith("image/")) {
          toast("請選擇圖片檔");
          return;
        }
        const coverEl = document.querySelector(`[data-cover="${photoTarget}"]`);
        if (coverEl)
          coverEl.insertAdjacentHTML(
            "beforeend",
            `<div class="loading-photo">處理中…</div>`,
          );
        try {
          const data = await compress(file);
          const prev = photos[photoTarget];
          photos[photoTarget] = data;
          if (!savePhotos()) {
            if (prev) photos[photoTarget] = prev;
            else delete photos[photoTarget];
            toast("儲存空間已滿，請先移除幾張圖片");
          } else toast("已更新圖片");
        } catch (e) {
          toast("這張圖片無法讀取，請換一張");
        }
        rerender();
      });

      document.addEventListener("click", (e) => {
        const pb = e.target.closest(".photo-btn");
        if (pb) {
          openSheet(pb.dataset.photo);
          return;
        }
        const f = e.target.closest(".fav");
        if (f) {
          const id = f.dataset.id,
            c = CAFES.find((x) => x.id === id);
          if (state.favs.has(id)) {
            state.favs.delete(id);
            toast(`已取消收藏「${c.name}」`);
          } else {
            state.favs.add(id);
            toast(`已加入收藏「${c.name}」`);
          }
          saveFavs();
          updateBadge();
          if (state.tab === "fav") {
            renderFav();
          } else {
            const on = state.favs.has(id);
            f.setAttribute("aria-pressed", on);
            f.setAttribute(
              "aria-label",
              (on ? "取消收藏 " : "加入收藏 ") + c.name,
            );
            f.classList.remove("pop");
            void f.offsetWidth;
            f.classList.add("pop");
          }
          return;
        }
        const tab = e.target.closest(".tab");
        if (tab) {
          setTab(tab.dataset.tab);
          return;
        }
        const go = e.target.closest("[data-tab-go]");
        if (go) {
          setTab(go.dataset.tabGo);
          return;
        }
        if (e.target.closest("[data-reset]")) {
          state.q = "";
          state.area = "全部";
          state.page = 1;
          qEl.value = "";
          clearBtn.classList.add("hidden");
          renderSearch();
        }
      });
      const qEl = document.getElementById("q"),
        clearBtn = document.getElementById("clearQ");
      qEl.addEventListener("input", () => {
        state.q = qEl.value;
        state.page = 1;
        clearBtn.classList.toggle("hidden", !qEl.value);
        renderSearch();
      });
      clearBtn.addEventListener("click", (e) => {
        e.preventDefault();
        qEl.value = "";
        state.q = "";
        state.page = 1;
        clearBtn.classList.add("hidden");
        renderSearch();
        qEl.focus();
      });

      updateBadge();
      renderSearch();
    </script>
  </body>
</html>
